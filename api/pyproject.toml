[tool.ruff]
target-version = "py312"
line-length = 120
lint.select = ["E", "F", "W", "I", "UP"]
lint.ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811"]
"alembic/*" = ["F401"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
no_strict_optional = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", ".."]
asyncio_default_fixture_loop_scope = "function"
