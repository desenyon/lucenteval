name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── API: lint, type-check, test ───────────────────────────────────────────
  api:
    name: API (Python)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lucent
          POSTGRES_PASSWORD: lucent
          POSTGRES_DB: lucenteval_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy app --ignore-missing-imports --no-strict-optional

      - name: Run migrations
        env:
          DATABASE_URL_SYNC: postgresql+psycopg2://lucent:lucent@localhost:5432/lucenteval_test
          DATABASE_URL: postgresql+asyncpg://lucent:lucent@localhost:5432/lucenteval_test
        run: alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://lucent:lucent@localhost:5432/lucenteval_test
          DATABASE_URL_SYNC: postgresql+psycopg2://lucent:lucent@localhost:5432/lucenteval_test
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
          S3_ENDPOINT_URL: ""
          SECRET_KEY: test-secret-key-minimum-32-characters
        run: pytest tests/ -v --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: api/coverage.xml
          flags: api

  # ── Engine: tests ─────────────────────────────────────────────────────────
  engine:
    name: Engine (Scorers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest pytest-cov ruff

      - name: Lint
        run: ruff check .

      - name: Run scorer tests
        run: pytest tests/ -v --cov=app

  # ── Platform: lint, type-check, build ────────────────────────────────────
  platform:
    name: Platform (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  # ── Docker Compose smoke test ─────────────────────────────────────────────
  compose-smoke:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy env file
        run: cp .env.example .env

      - name: Build and start services
        run: docker compose up -d --build postgres redis minio clickhouse
        timeout-minutes: 10

      - name: Wait for services
        run: |
          timeout 60 bash -c 'until docker compose exec -T postgres pg_isready -U lucent; do sleep 2; done'
          timeout 30 bash -c 'until docker compose exec -T redis redis-cli ping | grep -q PONG; do sleep 2; done'

      - name: Tear down
        run: docker compose down -v
        if: always()
