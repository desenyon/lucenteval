name: CI
on:
  push:
    branches: [main, develop, 'improve/**']
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api:
    name: API (Python + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lucent
          POSTGRES_PASSWORD: lucent
          POSTGRES_DB: lucenteval_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: api
    env:
      PYTHONPATH: '..'
      DATABASE_URL: postgresql+asyncpg://lucent:lucent@localhost:5432/lucenteval_test
      DATABASE_URL_SYNC: postgresql+psycopg2://lucent:lucent@localhost:5432/lucenteval_test
      TEST_DATABASE_URL: postgresql+asyncpg://lucent:lucent@localhost:5432/lucenteval_test
      TEST_DATABASE_URL_SYNC: postgresql+psycopg2://lucent:lucent@localhost:5432/lucenteval_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: mypy app --ignore-missing-imports --no-strict-optional
      - name: Migration regression and schema drift
        run: python ../infra/scripts/test_migration.py
      - name: PostgreSQL integration tests (including concurrent workers)
        run: pytest tests -v --cov=app --cov-report=term-missing
  offline:
    name: Offline API and scorers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r api/requirements.txt
      - run: ruff check api engine
      - run: pytest api/tests -v
      - run: pytest engine/tests -v --cov=engine/app
  platform:
    name: Platform (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_TELEMETRY_DISABLED: '1'
  compose-smoke:
    name: Docker mock end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 infra/scripts/init_env.py
      - name: Build API, engine and standalone platform; start all workers
        run: docker compose --profile demo up -d --build --wait --wait-timeout 180
      - name: Evaluate mock agent, export frozen traces, deliver webhook
        run: docker compose exec -T api python /workspace/infra/scripts/smoke_eval.py
      - name: Verify standalone platform
        run: curl --fail http://localhost:3000/api/health
      - name: Diagnostics
        if: failure()
        run: docker compose logs --tail=100
      - name: Tear down
        if: always()
        run: docker compose --profile demo down -v
