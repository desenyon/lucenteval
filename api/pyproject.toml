[tool.ruff]
target-version = "py312"
line-length = 120
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ruff.per-file-ignores]
"tests/*" = ["F401", "F811"]
"alembic/*" = ["F401"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
no_strict_optional = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
